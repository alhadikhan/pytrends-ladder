[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytrends-ladder"
version = "0.1.0"
description = "Compare up to 100 Google Trends keywords on one scale. A pytrends alternative with a drop-in TrendReq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Md. Al-Hadi Khan" }]
keywords = ["google trends", "pytrends", "pytrends alternative", "share of search", "keyword research", "seo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = ["apify-client>=2.0", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://apify.com/alhadikhan/google-trends-compare"
"Share of Search" = "https://apify.com/alhadikhan/share-of-search"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrends_ladder"]
